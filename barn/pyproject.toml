[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barn-runtime"
version = "0.1.0"
description = "Artifact-conditioned organization runtime for inspectable agent specialization"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=6,<7"]
qoder = ["qoder-agent-sdk"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
